<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지도 · 머니 to 홈</title>
  <!-- 모든 화면이 common.css를 먼저, 화면의 CSS를 그 뒤에 불러 쓴다. -->
  <link rel="stylesheet" href="css/common.css">
  <!-- ?v= 는 버전 표시다. map.css나 map-view.js를 고치면 숫자를 올린다. 브라우저가 예전 파일을 캐시에서 꺼내 쓰지 않게 한다. -->
  <link rel="stylesheet" href="css/map.css?v=20261013-3">
  <link rel="stylesheet" href="css/region.css?v=20261013-1">
</head>
<body class="map-body">
  <!-- P-05 ① 지도 기본. Figma "확정 목업 v3"의 "v3 · P-05 ① 지도 기본" (node 2037:3).
       모바일에는 헤더가 없다. 맨 위는 내 조건 줄이고, 그 아래를 지도가 가득 채운다.
       담당: 안세환. 목록(list.js, 김목산)과 시나리오 탭(scenario.js, 박채은)은 아래 창이 생기면 각자 파일에서 붙인다. -->

  <!-- 모바일 화면의 틀. 지금은 모바일(390 × 844)을 먼저 만든다. 화면이 더 커도 이 크기로 가운데에 둔다. -->
  <div class="map-app">

  <!-- 내 조건 줄 (높이 40). 문장이 넘치면 말줄임 -->
  <div class="condition-bar">
    <p class="condition-bar__text">
      <span class="condition-bar__label">내 조건</span>
      <span class="condition-bar__sentence" id="condition-sentence"></span>
    </p>
    <div class="condition-bar__actions">
      <a class="condition-bar__link condition-bar__link--edit" href="profile.html">수정</a>
      <a class="condition-bar__link" href="login.html" id="login-link">로그인</a>
    </div>
  </div>

  <main class="map-area">
    <!-- 지도. 카카오맵 JavaScript SDK가 #kakao-map 안에 지도와 아파트 말풍선을 그린다 (map-view.js).
         SDK는 지도 그림만 불러온다. 주소를 좌표로 바꾸는 기능(services)은 불러오지 않는다.
         좌표는 data/geocode.py가 미리 DB에 넣고, 화면은 DB의 좌표만 읽는다 (NFR-08). -->
    <div class="map" id="map">
      <div class="map__kakao" id="kakao-map" aria-label="지도"></div>
      <!-- 불러오는 중, 불러오지 못함 (P-05 ⑰) -->
      <div class="map__message" id="map-message">
        <p class="map__message-text" id="map-message-text">지도를 불러오는 중입니다.</p>
        <button type="button" class="link-button" id="map-retry" hidden>다시 시도</button>
      </div>
    </div>

    <!-- 검색 줄: 구·동 선택, 아파트 이름 검색 (검색은 2차) -->
    <div class="search-row">
      <button type="button" class="region-button" id="region-button">
        <span class="region-button__name" id="region-name"></span>
        <span class="region-button__arrow" aria-hidden="true">▾</span>
      </button>
      <label class="search-box">
        <!-- 임시 아이콘. Figma의 "돋보기"(2037:64)를 내보내면 img/icon-search.svg로 바꾼다. -->
        <svg class="search-box__icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input class="search-box__input" type="search" placeholder="아파트 이름 검색" aria-label="아파트 이름 검색">
      </label>
    </div>

    <!-- 조건 칩 줄: 면적, 가격, 준공 연도 (2차), 자금 부족 표시 스위치 -->
    <div class="chip-row">
      <button type="button" class="filter-chip" data-filter="area">면적 ▾</button>
      <button type="button" class="filter-chip" data-filter="price">가격 ▾</button>
      <button type="button" class="filter-chip" data-filter="year">준공 연도 ▾</button>
      <button type="button" class="filter-chip filter-chip--switch" id="lack-switch" role="switch" aria-checked="true">
        자금 부족
        <span class="switch" aria-hidden="true"><span class="switch__knob"></span></span>
      </button>
    </div>

    <!-- 조건 칩 아래 검은 알림. 잠시 뒤 사라진다 (와이어프레임 P-05 ㉑, ⑪) -->
    <p class="map-toast" id="map-toast" role="status" hidden></p>

    <!-- 오른쪽 아래 버튼: ㎡/평 전환, 현재 위치, 확대·축소 (2차) -->
    <div class="map-controls">
      <button type="button" class="map-button map-button--unit" id="unit-button" aria-label="면적 단위 바꾸기">
        <span class="map-button__main" id="unit-main">㎡</span>
        <span class="map-button__sub" id="unit-sub">평</span>
      </button>
      <button type="button" class="map-button map-button--locate" id="locate-button" aria-label="현재 위치">
        <!-- 임시 아이콘. Figma의 "과녁"(2037:83)을 내보내면 img/icon-locate.svg로 바꾼다. -->
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
          <path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="zoom-buttons">
        <button type="button" class="map-button" id="zoom-in" aria-label="확대">+</button>
        <button type="button" class="map-button" id="zoom-out" aria-label="축소">−</button>
      </div>
    </div>

    <!-- 왼쪽 아래: 범례 (처음부터 펼침), 안내 아이콘 -->
    <div class="legend" id="legend">
      <button type="button" class="legend__head" id="legend-toggle" aria-expanded="true" aria-controls="legend-list">
        <span class="legend__title">범례</span>
        <span class="legend__arrow" aria-hidden="true">▾</span>
      </button>
      <ul class="legend__list" id="legend-list">
        <li class="legend__item"><span class="legend__swatch legend__swatch--now"></span>지금 가능</li>
        <li class="legend__item"><span class="legend__swatch legend__swatch--within"></span>기간 내 가능</li>
        <li class="legend__item"><span class="legend__swatch legend__swatch--lack"></span>자금 부족</li>
      </ul>
    </div>

    <div class="info-tip">
      <button type="button" class="info-tip__button" id="info-button" aria-label="표시되는 아파트 안내" aria-expanded="false" aria-controls="info-text">!</button>
      <!-- 실거래 기록 안내 (FR-COMMON-02). 문구의 끝에 수집 기준일을 붙이는 것은 2차 (와이어프레임 B5) -->
      <p class="info-tip__text" id="info-text" role="tooltip" hidden>
        판매 중인 매물이 아니라 최근 1년 실거래 기록입니다. 금액은 가정에 따른 추정치입니다.
      </p>
    </div>

    <!-- 가운데 아래: 축척. 확대 수준에 따라 거리와 막대 길이가 바뀐다 (map-view.js의 renderScale) -->
    <div class="map-scale" aria-hidden="true">
      <span class="map-scale__label" id="scale-label">200m</span>
      <span class="map-scale__bar" id="scale-bar"></span>
    </div>

    <!-- 오른쪽 아래: 목록 보기. 누르면 아래 창(P-06 ⑤)에 목록이 뜬다. 아래 창은 다음 단계에서 만든다. -->
    <button type="button" class="list-button" id="list-button">
      <span class="list-button__icon" aria-hidden="true"><span></span><span></span><span></span></span>
      목록 보기
    </button>
  </main>

  <!-- 구·동 선택 (P-05 ⑬). 지역 버튼을 누르면 js/region.js가 이 안에 그린다. -->
  <section class="region-sheet" id="region-sheet" aria-label="지역 선택" hidden></section>

  </div>

  <!-- 공통 JavaScript. 모든 화면이 이 순서로 먼저 불러 쓴다. 그 아래에 화면의 파일을 둔다. -->
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/format.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/region.js?v=20261013-1"></script>
  <script src="js/map-view.js?v=20261013-4"></script>
</body>
</html>
