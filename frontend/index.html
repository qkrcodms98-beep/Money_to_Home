<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>머니 to 홈</title>
  <!-- 모든 화면이 common.css를 먼저, 화면의 CSS를 그 뒤에 불러 쓴다. -->
  <link rel="stylesheet" href="css/common.css?v=20261014-1">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <!-- P-01 ① 시작 화면 (로그인하지 않음). Figma "확정 목업 v3"의 P-01 ①. 모바일에는 헤더가 없다. -->
  <div class="top-space"></div>

  <div class="start-layout">
    <main class="page start">
      <img class="start__logo" src="img/logo.svg" alt="">

      <h1 class="title title--display">내 자산과 저축, 대출로<br>목표할 수 있는 집을<br>지도에서 찾아보세요</h1>
      <p class="subtitle">광주 5개 구 아파트의 최근 1년 실거래가로 계산합니다.</p>

      <ol class="steps">
        <li class="steps__item">
          <span class="steps__number">1</span>
          <span class="steps__text">
            <span class="steps__name">내 자금 입력</span>
            <span class="steps__desc">보유자산과 매달 모을 수 있는 금액</span>
          </span>
        </li>
        <li class="steps__item">
          <span class="steps__number">2</span>
          <span class="steps__text">
            <span class="steps__name">대출 상품 선택</span>
            <span class="steps__desc">상품 조건으로 계산하거나 대출 없이 계산</span>
          </span>
        </li>
        <li class="steps__item">
          <span class="steps__number">3</span>
          <span class="steps__text">
            <span class="steps__name">지도에서 확인</span>
            <span class="steps__desc">지금 가능, 기간 내 가능, 자금 부족</span>
          </span>
        </li>
      </ol>

      <p class="notice">
        집값을 예측하지 않습니다. 대출 금액은 추정치이며 실제 한도는 금융기관 심사로 결정됩니다.
        지도의 아파트는 매물이 아니라 실거래 기록입니다.
      </p>
    </main>

    <div class="bottom-action">
      <a class="button button--primary" id="start-button" href="profile.html">로그인 없이 시작하기</a>
    </div>
  </div>

  <!-- 공통 JavaScript. 모든 화면이 이 순서로 먼저 불러 쓴다. 그 아래에 화면의 파일을 둔다. -->
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/format.js?v=20261013-1"></script>
  <script src="js/guard.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
